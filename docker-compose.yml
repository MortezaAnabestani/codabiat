version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7
    container_name: codabiat-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-codabiat}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-codabiat123}
      MONGO_INITDB_DATABASE: codabiat
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - codabiat-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: codabiat-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGODB_USER:-codabiat}:${MONGODB_PASSWORD:-codabiat123}@mongodb:27017/codabiat?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_change_in_production}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-your_refresh_token_secret}
      REFRESH_TOKEN_EXPIRE: ${REFRESH_TOKEN_EXPIRE:-30d}
      CORS_ORIGIN: http://localhost:3000,http://localhost:5173,http://localhost
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    volumes:
      - ./apps/backend/uploads:/app/apps/backend/uploads
    networks:
      - codabiat-network

  # Dashboard (React + Vite)
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: codabiat-dashboard
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - codabiat-network

  # Frontend (Next.js)
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: codabiat-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - codabiat-network

networks:
  codabiat-network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
